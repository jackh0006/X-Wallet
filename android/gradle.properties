# Keep Android builds viable on modest developer/CI machines.  One worker is
# intentional: parallel Gradle/Kotlin workers can trigger the OOM killer on a
# 4 GB host without improving this small app's release build time.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# The Kotlin compiler is a separate JVM; cap it independently so a small
# Android build does not compete with Gradle for the whole host.
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
