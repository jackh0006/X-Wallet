# Build the Linux source artifact on a tag, record its provenance and SBOM
# attestations, and upload it.  This workflow never publishes a GitHub Release,
# never signs a package, and never handles a secret.  The maintainer verifies
# and signs the downloaded artifact locally; see docs/RELEASE_EVIDENCE.md.
name: release-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-source-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Flutter toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Build the Linux release bundle
        run: flutter build linux --release

      - name: Create a deterministic source-artifact archive
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -czf x-wallet-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
          sha256sum x-wallet-linux-x64.tar.gz | tee x-wallet-linux-x64.tar.gz.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: x-wallet-linux-x64.tar.gz

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: x-wallet-linux-x64.tar.gz
          sbom-path: docs/SBOM.json

      - name: Upload the artifact and its checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x-wallet-linux-x64-${{ github.sha }}
          path: |
            x-wallet-linux-x64.tar.gz
            x-wallet-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
