# Static verification: formatting, analyzer, full test suite, trusted-source
# links, independent ethers.js cold-signature verification, secret scan,
# dependency/licence inventory, test inventory, release manifest, SBOM
# freshness, and the release gate.  No release build or signing happens here.
name: verify
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No keystores or private keys tracked
        run: bash scripts/secret-scan.sh

  flutter:
    runs-on: ubuntu-24.04
    # The full suite includes deliberately expensive, production-parameter
    # Argon2id KDF cases. Keep them in the required check, with enough time
    # for a serial run on a hosted runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - name: Install the system Argon2 library used by flutter test
        run: sudo apt-get update && sudo apt-get install --yes libargon2-1
      - name: Formatting is part of the reviewed source
        run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-pub
      - run: bash scripts/test-suite.sh
      - name: Security mutation checks
        run: python3 scripts/security_mutation_check.py
      - name: Dependency advisory audit
        run: python3 scripts/dependency-audit.py
      - name: Dart licence inventory
        run: python3 scripts/license-check.py --dart-only

  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: flutter pub get
      - name: Build Linux release bundle from source
        run: flutter build linux --release

  cold-signature:
    # Independent of Dart: parses the exact signed bytes with ethers.js and
    # recovers the signer with a separate secp256k1 implementation.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: verification/package-lock.json
      - run: npm ci
      - name: npm dependency advisory audit
        run: npm audit --audit-level=low
      - name: npm licence inventory
        run: python3 ../scripts/license-check.py --npm-only
      - run: node verify.cjs

  sources-and-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch the tested commit
        run: |
          # The tested code commit predates the squash merge. Keep its signed
          # tag as a permanent, fetchable ref so the identity check can diff
          # the tested tree against the release tree.
          git fetch --no-tags origin \
            '+refs/tags/tested-*:refs/tags/tested-*' || true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: python3 scripts/check_token_sources.py
      - run: python3 scripts/check_release_evidence.py
      - name: Test inventory must list every test file
        run: python3 scripts/test_inventory.py --check
      - name: Release manifest must match the checkout
        run: python3 scripts/release_manifest.py --check
      - name: Product branding consistency
        run: python3 scripts/check_branding.py
      - name: Free-use policy
        run: python3 scripts/check_free_product.py
      - name: Release identity validator
        run: python3 scripts/check_release_identity.py
      - name: Release identity negative tests
        run: python3 scripts/test_release_identity.py
      - name: Verify Java keytool is available
        run: command -v keytool
      - name: Release signing tests
        run: bash scripts/test_release_signing.sh
      - name: Android signer inventory test
        run: bash scripts/test_android_inventory.sh
      - name: Release gate summary
        run: python3 scripts/release-gate.py --require-source
      - run: python3 scripts/sbom.py --out docs/SBOM.json
      - name: SBOM must be committed and current
        run: |
          git diff --exit-code docs/SBOM.json || {
            echo "::error ::docs/SBOM.json is stale — regenerate with scripts/sbom.py"
            exit 1
          }
