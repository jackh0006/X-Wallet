name: release-verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg apksigner >/dev/null
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          bash scripts/verify-release-assets.sh "$TAG" "$RUNNER_TEMP/x-wallet-assets"
