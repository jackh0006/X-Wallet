name: android-build

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - name: Android hardening source checks
        run: bash scripts/test_android_hardening.sh
      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub
      - name: Save arm64 APK and check ABI
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk x-wallet-android-arm64.apk
          unzip -l x-wallet-android-arm64.apk > arm64-files.txt
          grep -q 'lib/arm64-v8a/libapp.so' arm64-files.txt
          grep -q 'lib/arm64-v8a/libargon2-arm.so' arm64-files.txt
          ! grep -q 'lib/x86_64/libapp.so' arm64-files.txt
      - name: Build universal release APK (ARM 32/64, no x86_64)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-pub
      - name: Save universal APK and check ABIs
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk x-wallet-android-universal.apk
          unzip -l x-wallet-android-universal.apk > universal-files.txt
          grep -q 'lib/arm64-v8a/libapp.so' universal-files.txt
          grep -q 'lib/arm64-v8a/libargon2-arm.so' universal-files.txt
          grep -q 'lib/armeabi-v7a/libapp.so' universal-files.txt
          ! grep -q 'lib/x86_64/libapp.so' universal-files.txt
      - name: Verify the manifest label and identity
        run: |
          set -euo pipefail
          grep -q 'android:label="X Wallet"' android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.jackh0006.xwallet"' android/app/build.gradle.kts
          grep -q 'com.jackh0006.xwallet' android/app/src/main/kotlin/com/jackh0006/xwallet/MainActivity.kt
      # These Gradle outputs are DEBUG-SIGNED. They are deliberately not
      # uploaded as release artifacts. The publishable APKs are produced and
      # pinned by scripts/build-apk.sh with the owner keystore and signer gate.
      - name: State that these are not release artifacts
        run: |
          echo "Gradle release output is debug-signed and is NOT a publishable APK."
          echo "Publish only artifacts produced by scripts/build-apk.sh."
